name: MVC Testing Pipeline

on:
  pull_request:
    branches:
      - develop
      - release-1.0.0
      - release-1.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: 11
          distribution: 'adopt'

      - name: Build with Maven
        run: mvn clean package -DskipTests=true

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: 11
          distribution: 'adopt'

      - name: Run Tests
        run: mvn test -pl telegram/telegram-microservice -am

      - name: Calculate Test Coverage
        run: |
          percentage=$(awk -F"," '{ instructions += $6 + $7; covered += $7 } END { print 100*covered/instructions }' `find . -name "jacoco.csv"`)
          echo "Test Coverage: $percentage%"
          awk -v pct="$percentage" 'BEGIN {
            if (pct + 0 < 90) {
              print "Test coverage " pct "% is below the required 90% threshold";
              exit 1
            }
          }'
